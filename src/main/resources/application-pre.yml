# SPRING_PROFILES_ACTIVE=pre  →  https://rightsizingtool-pre.cma-cgm.com
# Secrets: AZURE_CLIENT_SECRET, DB_PASSWORD, MS_GRAPH_CLIENT_SECRET, FORECAST_API_KEY

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rst}

app:
  cors:
    allowed-origins: https://rightsizingtool-pre.cma-cgm.com
  security:
    sso:
      env: PRE
      client-id: ${AZURE_CLIENT_ID:}
      redirect-uri: https://rightsizingtool-pre.cma-cgm.com/api/sso/callback

server:
  servlet:
    session:
      cookie:
        secure: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

timesheet:
  sharepoint:
    root: 4.RST/2.5.PRE

process:
  remote: true

mail:
  enabled: ${MAIL_ENABLED:true}
