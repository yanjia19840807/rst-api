# SPRING_PROFILES_ACTIVE=pre  →  https://gbs-rst-pre.cma-cgm.com
# Required secrets: AZURE_CLIENT_SECRET, DB_PASSWORD, MS_GRAPH_CLIENT_SECRET

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://gbs-rst-pre.cma-cgm.com}
  security:
    sso:
      env: ${SSO_ENV:PRE}
      client-id: ${AZURE_CLIENT_ID:fb521db3-8ef5-479f-893d-21156dc0f27b}
      redirect-uri: ${AZURE_REDIRECT_URI:https://gbs-rst-pre.cma-cgm.com/api/sso/callback}

server:
  servlet:
    session:
      cookie:
        secure: ${SESSION_COOKIE_SECURE:true}

rst:
  sharepoint:
    root: ${RST_SHAREPOINT_ROOT:4.RST/2.UAT}
  mail:
    enabled: ${RST_MAIL_ENABLED:true}

microsoft:
  graph:
    enabled: ${MS_GRAPH_ENABLED:true}
