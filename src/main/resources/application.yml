spring:
  application:
    name: rst-api
  # Local `main` / `spring-boot:run` → application-dev.yml.
  # Deployed hosts must set SPRING_PROFILES_ACTIVE to uat | pre | prod.
  profiles:
    default: dev
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rst}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 100
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  web:
    error:
      include-message: never
server:
  tomcat:
    max-http-form-post-size: 25MB
    max-swallow-size: 25MB
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

decorator:
  datasource:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    sso:
      tenant-id: ${AZURE_TENANT_ID:9d314297-75dc-4329-8f94-a66489b4b9bb}
      client-id: ${AZURE_CLIENT_ID:}
      client-secret: ${AZURE_CLIENT_SECRET:}
      redirect-uri: ${AZURE_REDIRECT_URI:}
      env: ${SSO_ENV:}

rst:
  forecast:
    base-url: ${RST_FORECAST_BASE_URL:http://localhost:8000}
    connect-timeout-ms: ${RST_FORECAST_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${RST_FORECAST_READ_TIMEOUT_MS:60000}
    enabled: ${RST_FORECAST_ENABLED:true}
    confidence-level: ${RST_FORECAST_CONFIDENCE:0.95}
  mail:
    enabled: ${RST_MAIL_ENABLED:false}
    redirect-to: ${RST_MAIL_REDIRECT_TO:}
  sharepoint:
    root: ${RST_SHAREPOINT_ROOT:4.RST/2.UAT}

timesheet:
  process:
    source: ${TIMESHEET_PROCESS_SOURCE:classpath}
    classpath-location: ${TIMESHEET_PROCESS_CLASSPATH:GBS Process.csv}
  sync:
    enabled: false
    kind: all
    schedule:
      enabled: ${TIMESHEET_SYNC_SCHEDULE_ENABLED:false}
      daily-cron: ${TIMESHEET_SYNC_DAILY_CRON:0 0 6 * * ?}
      monthly-cron: ${TIMESHEET_SYNC_MONTHLY_CRON:0 30 6 * * ?}

microsoft:
  graph:
    enabled: ${MS_GRAPH_ENABLED:false}
    secret-name: ${MS_GRAPH_SECRET_NAME:timesheet-prd-microsoft-graph-credentials}
    tenant-id: ${MS_GRAPH_TENANT_ID:${AZURE_TENANT_ID:9d314297-75dc-4329-8f94-a66489b4b9bb}}
    client-id: ${MS_GRAPH_CLIENT_ID:}
    client-secret: ${MS_GRAPH_CLIENT_SECRET:}
    sharepoint-site: ${MS_GRAPH_SHAREPOINT_SITE:https://cmacgmgroup.sharepoint.com/sites/CMA-SharedKPIAutomation}
    list-name: ${MS_GRAPH_LIST_NAME:Timesheet}
    from-mail: ${MS_GRAPH_FROM_MAIL:GBS.TIMESHEET@cma-cgm.com}
