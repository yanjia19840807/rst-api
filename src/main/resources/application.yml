spring:
  application:
    name: rst-api
  # IDE / bare `main` runs use application-dev.yml unless overridden.
  # Production must set SPRING_PROFILES_ACTIVE (e.g. prod) explicitly.
  profiles:
    default: dev
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rst}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 100
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  web:
    error:
      include-message: never
server:
  tomcat:
    max-http-form-post-size: 25MB
    max-swallow-size: 25MB

# Keep p6spy JDBC logging off outside local/dev (enable in application-dev.yml).
decorator:
  datasource:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    azure-tenant-id: ${AZURE_TENANT_ID:}
    # SSO claim name for GBS Center. Dev uses app.security.dev-identity.center instead.
    center-claim: Center

rst:
  forecast:
    base-url: ${RST_FORECAST_BASE_URL:http://localhost:8000}
    connect-timeout-ms: ${RST_FORECAST_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${RST_FORECAST_READ_TIMEOUT_MS:60000}
    enabled: ${RST_FORECAST_ENABLED:true}
    confidence-level: ${RST_FORECAST_CONFIDENCE:0.95}
  workflow:
    # Timesheet has no LTH column yet; LTH steps share this position until IAM provides one.
    lth-position-id: ${RST_WORKFLOW_LTH_POSITION_ID:LTH}
  sharepoint:
    # RST-owned root in the Timesheet library. Daily / Monthly / Template hang off this.
    root: ${RST_SHAREPOINT_ROOT:2.UAT/Data Output/RST}

timesheet:
  sync:
    enabled: false
    kind: all
    schedule:
      enabled: ${TIMESHEET_SYNC_SCHEDULE_ENABLED:false}
      daily-cron: ${TIMESHEET_SYNC_DAILY_CRON:0 0 6 * * ?}
      monthly-cron: ${TIMESHEET_SYNC_MONTHLY_CRON:0 30 6 * * ?}

microsoft:
  graph:
    enabled: ${MS_GRAPH_ENABLED:false}
    secret-name: ${MS_GRAPH_SECRET_NAME:timesheet-prd-microsoft-graph-credentials}
    tenant-id: ${MS_GRAPH_TENANT_ID:${AZURE_TENANT_ID:}}
    client-id: ${MS_GRAPH_CLIENT_ID:}
    client-secret: ${MS_GRAPH_CLIENT_SECRET:}
    sharepoint-site: ${MS_GRAPH_SHAREPOINT_SITE:https://cmacgmgroup.sharepoint.com/sites/CMA-SharedKPIAutomation}
    list-name: ${MS_GRAPH_LIST_NAME:Timesheet}
    from-mail: ${MS_GRAPH_FROM_MAIL:GBS.TIMESHEET@cma-cgm.com}
