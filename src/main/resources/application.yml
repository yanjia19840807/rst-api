spring:
  application:
    name: rst-api
  # IDE / bare `main` runs use application-dev.yml unless overridden.
  # Production must set SPRING_PROFILES_ACTIVE (e.g. prod) explicitly.
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rst}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 100
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
  web:
    error:
      include-message: never

# Keep p6spy JDBC logging off outside local/dev (enable in application-dev.yml).
decorator:
  datasource:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    azure-tenant-id: ${AZURE_TENANT_ID:}

rst:
  forecast:
    base-url: ${RST_FORECAST_BASE_URL:http://localhost:8000}
    connect-timeout-ms: ${RST_FORECAST_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${RST_FORECAST_READ_TIMEOUT_MS:60000}
    enabled: ${RST_FORECAST_ENABLED:true}
    confidence-level: ${RST_FORECAST_CONFIDENCE:0.95}
