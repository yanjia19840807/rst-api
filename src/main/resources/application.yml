# Env keys consumed here (see .env.example). Unknown keys in .env are ignored.
# DB_URL DB_USERNAME DB_PASSWORD
# AZURE_CLIENT_ID AZURE_CLIENT_SECRET
# MS_GRAPH_CLIENT_ID MS_GRAPH_CLIENT_SECRET
# TIMESHEET_SYNC_DAILY_ENABLED TIMESHEET_SYNC_MONTHLY_ENABLED
# PROCESS_REMOTE
# MAIL_ENABLED
# FORECAST_ENABLED FORECAST_API_KEY
spring:
  application:
    name: rst-api
  # Import .env first so SPRING_PROFILES_ACTIVE in that file can activate a profile.
  # Official hosts also export it as a process env. Local default is uat.
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:uat}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rst}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 100
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  web:
    error:
      include-message: never
server:
  tomcat:
    max-http-form-post-size: 25MB
    max-swallow-size: 25MB
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax
        secure: false

decorator:
  datasource:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
  security:
    sso:
      tenant-id: 9d314297-75dc-4329-8f94-a66489b4b9bb
      client-id: ${AZURE_CLIENT_ID:}
      client-secret: ${AZURE_CLIENT_SECRET:}

timesheet:
  sharepoint:
    site: https://cmacgmgroup.sharepoint.com/sites/CMA-SharedKPIAutomation
    library: Timesheet
    # 4.RST/0.DEV · 1.SIT · 2.UAT · 2.5.PRE · 3.Production
    root: 4.RST/2.UAT
  sync:
    daily:
      enabled: ${TIMESHEET_SYNC_DAILY_ENABLED:false}
      cron: "0 0 6 * * ?"
    monthly:
      enabled: ${TIMESHEET_SYNC_MONTHLY_ENABLED:false}
      cron: "0 30 6 * * ?"

process:
  remote: ${PROCESS_REMOTE:false}
  classpath-location: timesheet/GBS Process.csv
  sharepoint:
    site: https://cmacgmgroup.sharepoint.com/sites/CMA-GlobalBusinessServices
    list: GBS Process

mail:
  enabled: ${MAIL_ENABLED:false}
  redirect-to:
  from: GBS.TIMESHEET@cma-cgm.com

forecast:
  base-url: http://localhost:8000
  connect-timeout-ms: 3000
  read-timeout-ms: 60000
  enabled: ${FORECAST_ENABLED:true}
  confidence-level: 0.95
  api-key: ${FORECAST_API_KEY:}

microsoft:
  graph:
    secret-name: timesheet-prd-microsoft-graph-credentials
    tenant-id: 9d314297-75dc-4329-8f94-a66489b4b9bb
    client-id: ${MS_GRAPH_CLIENT_ID:}
    client-secret: ${MS_GRAPH_CLIENT_SECRET:}
