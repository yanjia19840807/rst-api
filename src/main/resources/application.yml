spring:
  application:
    name: rst-api
  # IDE / bare `main` runs use application-dev.yml unless overridden.
  # Production must set SPRING_PROFILES_ACTIVE (e.g. prod) explicitly.
  profiles:
    default: dev
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rst}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 100
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
  web:
    error:
      include-message: never

# Keep p6spy JDBC logging off outside local/dev (enable in application-dev.yml).
decorator:
  datasource:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    azure-tenant-id: ${AZURE_TENANT_ID:}

rst:
  forecast:
    base-url: ${RST_FORECAST_BASE_URL:http://localhost:8000}
    connect-timeout-ms: ${RST_FORECAST_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${RST_FORECAST_READ_TIMEOUT_MS:60000}
    enabled: ${RST_FORECAST_ENABLED:true}
    confidence-level: ${RST_FORECAST_CONFIDENCE:0.95}
  workflow:
    # Timesheet has no LTH column yet; LTH steps share this position until IAM provides one.
    lth-position-id: ${RST_WORKFLOW_LTH_POSITION_ID:LTH}

microsoft:
  graph:
    enabled: ${MS_GRAPH_ENABLED:false}
    # Azure / K8s secret that supplies client-id + client-secret in production.
    secret-name: ${MS_GRAPH_SECRET_NAME:timesheet-prd-microsoft-graph-credentials}
    tenant-id: ${MS_GRAPH_TENANT_ID:${AZURE_TENANT_ID:}}
    auth-uri: ${MS_GRAPH_AUTH_URI:https://login.microsoftonline.com/${AZURE_TENANT_ID:}/oauth2/v2.0/token}
    client-id: ${MS_GRAPH_CLIENT_ID:}
    client-secret: ${MS_GRAPH_CLIENT_SECRET:}
    scope: https://graph.microsoft.com/.default
    graph-host: https://graph.microsoft.com/v1.0
    sharepoint-site: ${MS_GRAPH_SHAREPOINT_SITE:https://cmacgmgroup.sharepoint.com/sites/CMA-SharedKPIAutomation}
    list-name: ${MS_GRAPH_LIST_NAME:Timesheet}
    env-prefix: ${MS_GRAPH_ENV_PREFIX:3.Production}
