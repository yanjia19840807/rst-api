# Local development. Profile default. No Azure SSO — Dev Identity only.
# Deployed dev host: https://rightsizingtool-dev.cma-cgm.com

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rst}

timesheet:
  sharepoint:
    root: ${TIMESHEET_SHAREPOINT_ROOT:4.RST/0.DEV}

process:
  remote: ${PROCESS_REMOTE:true}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://rightsizingtool-dev.cma-cgm.com}
  security:
    sso:
      redirect-uri: ${AZURE_REDIRECT_URI:https://rightsizingtool-dev.cma-cgm.com/api/sso/callback}
    dev-identity:
      override-enabled: true

mail:
  enabled: ${MAIL_ENABLED:true}

microsoft:
  graph:
    client-id: ${MS_GRAPH_CLIENT_ID:}

decorator:
  datasource:
    enabled: true
    p6spy:
      enable-logging: true
      logging: slf4j
      multiline: true
      log-format: "%(executionTime)ms | %(category) | connection %(connectionId)\n%(sql)"
      exclude-categories: info,debug,result,resultset,batch

logging:
  level:
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn
    p6spy: info
    com.cmacgm.gbs.rst.api.forecast: info
    com.cmacgm.gbs.rst.api.graph: info
