# Local development. Profile default. No Azure SSO — Dev Identity only.
# Deployed gbs-rst-dev should use uat/pre/prod if Azure login is required
# (SSO role suffix is UAT / PRE / PROD only).

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    dev-identity:
      override-enabled: true

server:
  servlet:
    session:
      cookie:
        secure: false

rst:
  sharepoint:
    root: ${RST_SHAREPOINT_ROOT:4.RST/2.UAT}
  mail:
    enabled: ${RST_MAIL_ENABLED:true}
    redirect-to: ${RST_MAIL_REDIRECT_TO:}

microsoft:
  graph:
    enabled: ${MS_GRAPH_ENABLED:true}
    client-id: ${MS_GRAPH_CLIENT_ID:2b5ec0be-1344-4161-80f5-b7674d74f019}
    client-secret: ${MS_GRAPH_CLIENT_SECRET:}

decorator:
  datasource:
    enabled: true
    p6spy:
      enable-logging: true
      logging: slf4j
      multiline: true
      log-format: "%(executionTime)ms | %(category) | connection %(connectionId)\n%(sql)"
      exclude-categories: info,debug,result,resultset,batch

logging:
  level:
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn
    p6spy: info
    com.cmacgm.gbs.rst.api.forecast: info
    com.cmacgm.gbs.rst.api.graph: info
