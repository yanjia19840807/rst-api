spring:
  datasource:
    url: "jdbc:h2:mem:rst;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=YEAR,MONTH"
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop

app:
  security:
    dev-identity:
      override-enabled: true
      ccgid: SUPERVISOR001
      role: SUPERVISOR
      center: Kuala Lumpur

rst:
  forecast:
    enabled: false
    base-url: http://localhost:8000
    connect-timeout-ms: 1000
    read-timeout-ms: 1000
    confidence-level: 0.95
  workflow:
    lth-position-id: LTH
  mail:
    workflow-enabled: false
    redirect-to:

microsoft:
  graph:
    enabled: false
