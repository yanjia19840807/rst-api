# SPRING_PROFILES_ACTIVE=uat  →  https://gbs-rst-uat.cma-cgm.com
# Secrets: AZURE_CLIENT_SECRET, DB_PASSWORD, MS_GRAPH_CLIENT_SECRET

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://gbs-rst-uat.cma-cgm.com}
  security:
    sso:
      env: ${SSO_ENV:UAT}
      client-id: ${AZURE_CLIENT_ID:522ce29d-df11-438a-b18b-fede0b45ae5b}
      redirect-uri: ${AZURE_REDIRECT_URI:https://gbs-rst-uat.cma-cgm.com/api/sso/callback}

decorator:
  datasource:
    enabled: true
    p6spy:
      enable-logging: true
      logging: slf4j
      multiline: true
      log-format: "%(executionTime)ms | %(category) | connection %(connectionId)\n%(sql)"
      exclude-categories: info,debug,result,resultset,batch
      
server:
  servlet:
    session:
      cookie:
        secure: ${SESSION_COOKIE_SECURE:true}

mail:
  enabled: ${MAIL_ENABLED:true}
