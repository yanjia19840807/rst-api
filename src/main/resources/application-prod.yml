# SPRING_PROFILES_ACTIVE=prod  →  https://gbs-rst.cma-cgm.com
# Secrets: AZURE_CLIENT_SECRET, DB_PASSWORD, MS_GRAPH_CLIENT_SECRET

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://gbs-rst.cma-cgm.com}
  security:
    sso:
      env: ${SSO_ENV:PROD}
      client-id: ${AZURE_CLIENT_ID:e4467cee-0107-4003-b998-2d3785471e80}
      redirect-uri: ${AZURE_REDIRECT_URI:https://gbs-rst.cma-cgm.com/api/sso/callback}

server:
  servlet:
    session:
      cookie:
        secure: ${SESSION_COOKIE_SECURE:true}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

timesheet:
  sharepoint:
    root: ${TIMESHEET_SHAREPOINT_ROOT:4.RST/3.Production}

process:
  remote: true

mail:
  enabled: ${MAIL_ENABLED:true}
