# SPRING_PROFILES_ACTIVE=prod  →  https://rightsizingtool.cma-cgm.com
# Secrets: AZURE_CLIENT_SECRET, DB_PASSWORD, MS_GRAPH_CLIENT_SECRET, FORECAST_API_KEY

app:
  cors:
    allowed-origins: https://rightsizingtool.cma-cgm.com,http://localhost:5173,http://127.0.0.1:5173
  security:
    sso:
      env: PROD
      client-id: ${AZURE_CLIENT_ID:}
      redirect-uri: https://rightsizingtool.cma-cgm.com/api/sso/callback

server:
  servlet:
    session:
      cookie:
        secure: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

timesheet:
  sharepoint:
    root: 4.RST/3.Production

process:
  remote: true

mail:
  enabled: ${MAIL_ENABLED:true}

forecast:
  base-url: http://rst-forecast-svc.rightsizingtool-prd.svc.cluster.local:8000
